name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset: panfind-windows-amd64.exe
          - label: macOS amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset: panfind-macos-amd64
          - label: macOS arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset: panfind-macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify runner platform
        shell: pwsh
        run: |
          $actualOS = go env GOOS
          $actualArch = go env GOARCH
          if ($actualOS -ne '${{ matrix.goos }}' -or $actualArch -ne '${{ matrix.goarch }}') {
            throw "Unexpected runner platform: $actualOS/$actualArch"
          }

      - name: Require GNU findutils on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gnuFind = 'C:\Program Files\Git\usr\bin\find.exe'
          if (-not (Test-Path -LiteralPath $gnuFind)) {
            throw "GNU findutils was not found at $gnuFind"
          }
          & $gnuFind --version
          "PANFIND_GNU_FIND=$gnuFind" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install GNU findutils on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install findutils
          echo "PANFIND_GNU_FIND=$(brew --prefix findutils)/libexec/gnubin/find" >> "$GITHUB_ENV"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w" -o 'dist/${{ matrix.asset }}' ./cmd/panfind

      - name: Smoke test executable
        shell: pwsh
        run: |
          $reportedVersion = & './dist/${{ matrix.asset }}' version
          if ($reportedVersion -ne 'panfind dev') {
            throw "Built executable reported an unexpected version: $reportedVersion"
          }

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}-${{ github.sha }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
