name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            executable: panfind-windows-amd64.exe
            asset: panfind-windows-amd64.exe
          - label: macOS amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            executable: panfind-macos-amd64
            asset: panfind-macos-amd64.tar.gz
          - label: macOS arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            executable: panfind-macos-arm64
            asset: panfind-macos-arm64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag and runner
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $env:GITHUB_REF_NAME"
          }
          $actualOS = go env GOOS
          $actualArch = go env GOARCH
          if ($actualOS -ne '${{ matrix.goos }}' -or $actualArch -ne '${{ matrix.goarch }}') {
            throw "Unexpected runner platform: $actualOS/$actualArch"
          }

      - name: Build and verify executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ldflags = "-s -w -X github.com/lenovobenben/panfind/internal/version.Version=$env:GITHUB_REF_NAME"
          go build -trimpath -ldflags $ldflags -o 'dist/${{ matrix.executable }}' ./cmd/panfind
          $reportedVersion = & './dist/${{ matrix.executable }}' version
          if ($reportedVersion -ne "panfind $env:GITHUB_REF_NAME") {
            throw "Built executable reported an unexpected version: $reportedVersion"
          }

      - name: Package macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: tar -czf 'dist/${{ matrix.asset }}' -C dist '${{ matrix.executable }}'

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum panfind-* | sort -k2 > SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/panfind-windows-amd64.exe \
            dist/panfind-macos-amd64.tar.gz \
            dist/panfind-macos-arm64.tar.gz \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "PanFind $GITHUB_REF_NAME"
